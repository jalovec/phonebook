<VirtualHost *:80>
    ServerName app.phonebook.local

    DocumentRoot /var/www/symfony/public

    <Directory /var/www/symfony/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/app_error.log
    CustomLog /var/log/apache2/app_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName adminer.phonebook.local

    ProxyPreserveHost On
    ProxyPass / http://phonebook-adminer:8080/
    ProxyPassReverse / http://phonebook-adminer:8080/

    ErrorLog /var/log/apache2/adminer_error.log
    CustomLog /var/log/apache2/adminer_access.log combined
</VirtualHost>
